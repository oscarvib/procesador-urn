<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: instrument-panel workbench. Sidebar list of runs (pasadas) + stacked numbered blocks for the selected run; summary and settings as separate views. */
:root{
  --bg:#e9eef0; --panel:#ffffff; --panel2:#f5f8f9; --ink:#122028; --ink2:#4b5c67; --line:#d0dadf;
  --accent:#0c6a80; --accent-ink:#ffffff; --accent-soft:#d6eaef;
  --good:#1c7a4e; --warn:#a85a07; --bad:#b42318; --chip:#e1e9ec;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* chart tokens */
  --c-plotbg:#ffffff; --c-ink:#122028; --c-ink2:#5b6b75; --c-grid:#e4eaed; --c-grid2:#f1f4f6;
  --c-urn:#1d4ed8; --c-urnN:#b9c1c8; --c-bg:#6d63c4; --c-bgN:#d3cff3; --c-lim:#c81e1e; --c-lim2:#122028;
  --c-fit:#d62828; --c-raw:#3b82b8; --c-dwl:rgba(226,184,30,.28); --c-fondo:rgba(109,99,196,.14); --c-cpa:#119a52; --c-track:#1d4ed8;
  --c-series:#1d4ed8,#d1495b,#16857a,#d18f1b,#7c4dd1,#3d7f2f,#c2410c,#0e7490,#a21caf,#475569;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1418; --panel:#131f26; --panel2:#18262e; --ink:#dae5ea; --ink2:#93a6b0; --line:#25363f;
  --accent:#55b6cc; --accent-ink:#04202a; --accent-soft:#163a45;
  --good:#5cc191; --warn:#e3a04f; --bad:#f2877b; --chip:#1c2c34;
  --c-plotbg:#131f26; --c-ink:#dae5ea; --c-ink2:#93a6b0; --c-grid:#22333c; --c-grid2:#1a2a32;
  --c-urn:#7ea6ff; --c-urnN:#3e4c56; --c-bg:#a99ef5; --c-bgN:#38345d; --c-lim:#ff6f6f; --c-lim2:#dae5ea;
  --c-fit:#ff6b6b; --c-raw:#6aaedc; --c-dwl:rgba(240,200,60,.22); --c-fondo:rgba(169,158,245,.16); --c-cpa:#4fd38c; --c-track:#7ea6ff;
  --c-series:#7ea6ff,#ff8a9a,#5fd3c4,#f2c26b,#b39bff,#8fd16f,#ff9a5c,#5cc8e6,#e58bf0,#b8c4d2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1418; --panel:#131f26; --panel2:#18262e; --ink:#dae5ea; --ink2:#93a6b0; --line:#25363f;
  --accent:#55b6cc; --accent-ink:#04202a; --accent-soft:#163a45;
  --good:#5cc191; --warn:#e3a04f; --bad:#f2877b; --chip:#1c2c34;
  --c-plotbg:#131f26; --c-ink:#dae5ea; --c-ink2:#93a6b0; --c-grid:#22333c; --c-grid2:#1a2a32;
  --c-urn:#7ea6ff; --c-urnN:#3e4c56; --c-bg:#a99ef5; --c-bgN:#38345d; --c-lim:#ff6f6f; --c-lim2:#dae5ea;
  --c-fit:#ff6b6b; --c-raw:#6aaedc; --c-dwl:rgba(240,200,60,.22); --c-fondo:rgba(169,158,245,.16); --c-cpa:#4fd38c; --c-track:#7ea6ff;
  --c-series:#7ea6ff,#ff8a9a,#5fd3c4,#f2c26b,#b39bff,#8fd16f,#ff9a5c,#5cc8e6,#e58bf0,#b8c4d2;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
.brand{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink2);letter-spacing:0}
.brand .logo{width:30px;height:30px;align-self:center;border-radius:7px}
.brand .ver{font:600 12px var(--f-mono);letter-spacing:0;color:var(--ink2);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:1px 7px;align-self:center}
.brand .mark{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);position:relative;top:1px}
.brand .mark::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.tabs{display:flex;gap:4px;margin-left:auto}
.projbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.projbar .proj{font-size:13px;color:var(--ink2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projbar .proj b{color:var(--ink);font-weight:600}
.projbar .dirty{color:var(--warn);font-weight:600}
.welcome{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;max-width:760px}
.welcome h2{font:700 24px var(--f-disp);margin:0;color:var(--ink)}
.welcome p{margin:0;color:var(--ink2);max-width:64ch}
.welcome .acts{display:flex;flex-wrap:wrap;gap:8px}
.welcome ol{margin:0;padding-left:20px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.tabs button{font:600 14px var(--f-body);background:none;border:1px solid transparent;color:var(--ink2);padding:6px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--line)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1500px;margin:0 auto}
.view-p{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.view-p{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:900px){.side{position:static}}
.side h3,.blk h2,.vh{font-family:var(--f-disp);font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:14px;color:var(--ink2);margin:0}
.plist{display:flex;flex-direction:column;gap:6px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;font:inherit;color:inherit;width:100%}
.pcard[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pcard .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pcard .sub{grid-column:1/-1;font-size:13px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--chip);color:var(--ink2)}
.dot.ok{color:var(--good)} .dot.st{color:var(--warn)}
.dot.ok::before,.dot.st::before,.dot.no::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.del{background:none;border:none;color:var(--ink2);cursor:pointer;font-size:13px;padding:0 2px}
.del.arm{color:var(--bad);font-weight:600}
.btn{font:600 14px var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{font-size:13px;padding:4px 9px}
.btn:disabled{opacity:.5;cursor:default}
.btn input[type=file]{display:none}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.batch{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.batch summary{cursor:pointer;font-weight:600}
.batch .bi{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:13px}
.batch label{display:flex;flex-direction:column;gap:3px;color:var(--ink2)}
.detail{display:flex;flex-direction:column;gap:14px;min-width:0}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.blk h2{display:flex;align-items:center;gap:10px}
.blk h2 .n{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.limsel{font-size:13px;padding:3px 6px;max-width:100%}
.blk h2 .aside{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:400;font-size:13px}
.phead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.phead .pname{font:700 24px var(--f-disp);border:1px solid transparent;background:transparent;color:var(--ink);padding:2px 6px;border-radius:6px;min-width:0;flex:1 1 260px}
.phead .pname:hover,.phead .pname:focus{border-color:var(--line);background:var(--panel)}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2)}
.fld .in{display:flex;align-items:center;gap:6px;color:var(--ink)}
input[type=number],input[type=text],select{font:15px var(--f-body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{width:92px;font-family:var(--f-mono);font-size:14px}
.unit{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.grid-f{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.slot{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2);min-width:0}
.slot.drag{border-color:var(--accent);background:var(--accent-soft)}
.slot .lab{font-weight:600;font-size:13px}
.slot .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.slot select{flex:1 1 140px;max-width:100%}
.fname{font-family:var(--f-mono);font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.kv .k{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;display:flex;flex-direction:column;min-width:96px}
.kv .k span{font-size:12px;color:var(--ink2)}
.kv .k b{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.kv .k.hi{border-color:var(--accent)}
.note{font-size:13px;color:var(--ink2)}
.warn{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:6px;padding:6px 10px}
.err{font-size:13px;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:6px;padding:6px 10px}
.charts2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
@media (max-width:1100px){.charts2{grid-template-columns:minmax(0,1fr)}}
.cbox{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctool{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.ctool .t{font-weight:600;color:var(--ink);margin-right:auto}
.chart{position:relative;height:340px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--c-plotbg);touch-action:pan-y}
.chart.tall{height:470px} .chart.sq{height:380px} .chart.short{height:300px}
.chart canvas{display:block}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:460px}
table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);font-weight:600;color:var(--ink2);z-index:1}
td{font-family:var(--f-mono);font-size:12.5px}
td.l,th.l{text-align:left;font-family:var(--f-body)}
td.neg{color:var(--bad);font-weight:600} td.lo{color:var(--warn)}
.ctab input[type=number]{width:78px}
.ctab td{vertical-align:middle}
.stale{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog{height:4px;background:var(--chip);border-radius:3px;overflow:hidden;flex:1 1 120px;min-width:80px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:30px;text-align:center;color:var(--ink2)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sets .blk{gap:10px}
.form2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:14px}
.form2 label{color:var(--ink)}
.form2 .in{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.formula.wrap{white-space:pre-wrap}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre}
.how p{margin:0 0 6px;max-width:72ch}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:50;max-width:min(90vw,560px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#ovl{position:fixed;inset:0;z-index:60;background:rgba(5,12,16,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#ovl .box{background:var(--panel);border-radius:10px;padding:14px;max-width:min(1200px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#ovl img{max-width:100%;border:1px solid var(--line)}
#ovl textarea{width:min(900px,80vw);height:50vh;font:12px var(--f-mono);background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.sum-sel{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.sum-sel label{display:flex;gap:5px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <div class="brand"><img class="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwYzZhODAiLz48cGF0aCBkPSJNMTIgMjBoNDBsLTUgOUgxN3oiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMjcgMTNoMTF2N0gyN3oiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNNCAzMWM1LTMgOS0zIDE0IDBzOSAzIDE0IDAgOS0zIDE0IDAgOSAzIDE0IDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzlmZGNlYSIgc3Ryb2tlLXdpZHRoPSIyLjYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxnIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIj48cGF0aCBkPSJNMjQgMzhhMTEgMTEgMCAwIDAgMTYgMCIgc3Ryb2tlLXdpZHRoPSIyLjgiLz48cGF0aCBkPSJNMTkgNDJhMTcgMTcgMCAwIDAgMjYgMCIgc3Ryb2tlLXdpZHRoPSIyLjQiIG9wYWNpdHk9Ii44Ii8+PHBhdGggZD0iTTE0IDQ2YTI0IDI0IDAgMCAwIDM2IDAiIHN0cm9rZS13aWR0aD0iMiIgb3BhY2l0eT0iLjU1Ii8+PC9nPjxjaXJjbGUgY3g9IjMyIiBjeT0iNTYiIHI9IjMuMiIgZmlsbD0iI2ZmZDE2NiIvPjwvc3ZnPg==" alt="" width="30" height="30">Procesador URN <span class="ver" id="app-ver">v1.4.2</span><small>ruido radiado al agua · nivel de fuente a 1 m</small></div>
  <div class="projbar">

<script>
'use strict';
const APP_VERSION='1.4.2';
/* =====================================================================
   WORKER: lectura de ficheros (MAT v5/v7, UNV 58/58b, WAV), filtrado,
   RMS por bloques, tendencia, CPA y espectros de Welch.
   ===================================================================== */
const WORKER_SRC = String.raw`
'use strict';
const store=new Map();
const post=(m,tr)=>self.postMessage(m,tr||[]);
self.onmessage=async(e)=>{const m=e.data;try{
  if(m.cmd==='load'){
    const buf=await m.file.arrayBuffer();
    const chans=await parseAny(buf,m.file.name,p=>post({id:m.id,progress:p}));
    if(!chans.length) throw new Error('No se han encontrado canales de datos (vectores numéricos) en el fichero.');
    store.set(m.passId,{chans,cache:null});

    else{for(let i=0;i<n;i++){const xv=xs[i],yv=ys[i];if(!fin(yv)||!fin(xv)||(lx&&xv<=0)){on=false;continue}const px=X(xv),py=Y(yv);if(!on){c.moveTo(px,py);on=true}else c.lineTo(px,py)}}
    c.stroke()}
  stairs(c,s,X,Y,x0,x1,lx){c.beginPath();let on=false;for(let i=0;i<s.y.length;i++){const yv=s.y[i];if(!fin(yv)){on=false;continue}const a=X(s.lo[i]),b=X(s.hi[i]),py=Y(yv);if(!on){c.moveTo(a,py);on=true}else c.lineTo(a,py);c.lineTo(b,py)}c.stroke()}
  pts(c,s,X,Y){for(let i=0;i<s.x.length;i++)if(fin(s.x[i])&&fin(s.y[i]))this.mark(c,s.marker||'o',X(s.x[i]),Y(s.y[i]),s.size||4,s)}
  mark(c,m,x,y,r,s){c.lineWidth=s.w||1.5;c.beginPath();if(m==='x'){c.moveTo(x-r,y-r);c.lineTo(x+r,y+r);c.moveTo(x+r,y-r);c.lineTo(x-r,y+r);c.stroke()}
    else if(m==='O'){c.arc(x,y,r,0,7);c.save();c.fillStyle=s.fill||'#fff';c.fill();c.restore();c.stroke()}else{c.arc(x,y,r,0,7);c.fill()}}
}

/* carga por lotes */
$('#bf-go').onclick=async()=>{
  const sig=[...$('#bf-sig').files].sort((a,b)=>natSort(a.name,b.name));
  const sh=[...$('#bf-ship').files].sort((a,b)=>natSort(a.name,b.name)),hy=[...$('#bf-hyd').files].sort((a,b)=>natSort(a.name,b.name));
  if(!sig.length&&!sh.length){toast('Selecciona al menos ficheros de señal o GPS del barco');return}
  const ships=[],hyds=[];
  try{for(const f of sh)ships.push(await loadGPSFile(f,'ship'));for(const f of hy)hyds.push(await loadGPSFile(f,'hyd'));}catch(e){toast(e.message,5000);return}
  // emparejar barco ↔ boya por solape horario (o el más cercano en el tiempo)
  for(const s of ships){let best=null,bo=-1;for(const h of hyds){const o=overlap(s,h);if(o>bo){bo=o;best=h}}
    if(bo<=0){best=null;let gap=1e9;for(const h of hyds){const g=Math.min(Math.abs(h.t0-s.t1),Math.abs(s.t0-h.t1));if(g<gap){gap=g;best=h}}if(gap>1800)best=null}
    s.pairHyd=best?best.id:null;}
  const created=[];
  const base=sig.length?sig.map(f=>({name:f.name.replace(/\.[^.]+$/,''),file:f})):ships.map(s=>({name:s.name.replace(/\.[^.]+$/,''),ship:s}));
  for(const b of base){const g=guessFromName(b.name);const p=newPass({name:b.name,file:b.file||null,fileName:b.file?b.file.name:'',speed:g.speed,side:g.side||'STB'});
    if(b.ship){p.ship=b.ship.id;p.hyd=b.ship.pairHyd;}created.push(p);}
  if(sig.length&&ships.length){const used=new Set();
    const spd=s=>fin(s.speed)?s.speed:s.sog;
    for(const p of created){let c=ships.find(s=>!used.has(s.id)&&(!s.side||s.side===p.side)&&fin(p.speed)&&fin(spd(s))&&Math.abs(spd(s)-p.speed)<0.8);
      if(!c)c=ships.find(s=>!used.has(s.id));if(c){used.add(c.id);p.ship=c.id;p.hyd=c.pairHyd;}}}
  const bgs=[...$('#bf-bg').files].sort((a,b)=>natSort(a.name,b.name)).map(addBg);
  if(bgs.length)created.forEach((p,i)=>p.bgFile=(bgs.length===created.length?bgs[i]:bgs[0]).id);
  created.forEach(p=>{refreshGPS(p)});passes.push(...created);curId=created[0]?.id??curId;
  ['#bf-sig','#bf-ship','#bf-hyd','#bf-bg'].forEach(s=>$(s).value='');$('#batch').open=false;
  renderList();renderDetail();toast(`${created.length} pasadas creadas. Revisa los emparejamientos GPS y configura los canales en la primera.`,5500);
};

function bindDetail(p){
  const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener(ev,fn)};
  on('p-name','change',e=>{p.name=e.target.value.trim()||'Pasada';renderList()});
  on('p-speed','change',e=>{const v=parseFloat(e.target.value);p.speed=fin(v)?v:null;renderList();updProcInfo();updResults()});
  on('p-side','change',e=>{p.side=e.target.value;renderList();updResults()});
  on('p-ship','change',e=>{p.ship=+e.target.value||null;const s=poolGet(p.ship);if(s&&s.pairHyd&&!p.hyd){p.hyd=s.pairHyd;$('#p-hyd').innerHTML=poolOpts('hyd',p.hyd)}refreshGPS(p);afterGPS()});
  on('p-hyd','change',e=>{p.hyd=+e.target.value||null;refreshGPS(p);afterGPS()});
  on('p-hydmode','change',e=>{p.hydMode=e.target.value;$('#ll1').hidden=$('#ll2').hidden=p.hydMode!=='manual';refreshGPS(p);afterGPS()});
  on('p-lat','change',e=>{p.hydLat=parseFloat(e.target.value);refreshGPS(p);afterGPS()});
  on('p-lon','change',e=>{p.hydLon=parseFloat(e.target.value);refreshGPS(p);afterGPS()});
  const gpsFile=async(f,role)=>{try{const g=await loadGPSFile(f,role);if(role==='ship'){p.ship=g.id;const sp=guessFromName(f.name);if(!fin(p.speed)&&fin(sp.speed))p.speed=sp.speed;if(sp.side)p.side=sp.side;}else p.hyd=g.id;refreshGPS(p);renderList();renderDetail();}catch(e){toast(e.message,5000)}};
  on('f-ship','change',e=>{if(e.target.files[0])gpsFile(e.target.files[0],'ship')});
  on('f-hyd','change',e=>{if(e.target.files[0])gpsFile(e.target.files[0],'hyd')});
  const sigFile=async f=>{
    if(loaded.includes(p.id)){await call({cmd:'free',passId:p.id});loaded=loaded.filter(x=>x!==p.id)}
    const same=f.name===p.fileName;p.file=f;p.fileName=f.name;p.synth=false;p.err=null;p.meta=null;if(!same){p.res=null;p.chans=[];}
    const g=guessFromName(f.name);if(fin(g.speed)&&!fin(p.speed))p.speed=g.speed;if(g.side)p.side=g.side;
    if(/^Pasada( \d+)?$/.test(p.name))p.name=f.name.replace(/\.[^.]+$/,'');
    $('#sig-name').textContent=f.name+' · leyendo…';$('#sigprog').hidden=false;
    try{await ensureLoaded(p,x=>{$('#sigprog i').style.width=(x*100).toFixed(0)+'%'});toast('Señal cargada: '+p.meta.length+' canal(es)');}
    catch(e){p.err=e.message;toast(e.message,6000)}
    renderList();renderDetail();};

  charts.trend.set({title:t.trend(fmt(v,1),p.side),xlabel:t.time,ylabel:t.rms,xname:'t (s)',ydec:3,xlim:[0,R.dur],ylim:[0,mx*2||1],series:ser,

    <p>2 · <b>CPA acústico.</b> Señal filtrada paso alto, RMS por bloques y media móvil; el CPA es el máximo de esa tendencia (media cuadrática de los hidrófonos seleccionados) o el instante que fijes a mano.</p>
    <p>2b · <b>Sincronización.</b> La hora de inicio del registro (cabecera UNV o .mat, manual, o ajuste de la tendencia acústica con −20·log r(t) del GPS) sitúa cada instante de la señal en hora UTC. Así la ventana puede centrarse en el CPA geométrico y cada segmento de Welch se corrige con su propia distancia r(t) antes de promediar.</p>

    <div class="formula">r   = √( d_CPA² + (z_h − z_s)² )
SL  = 10·log10( Σ PSD·Δf / 1 µPa² ) + N(f)·log10(r)
N(f)= N₁ (f ≤ f₁) · lineal · N₂ (f ≥ f₂)
DWL = L  ó  2·d_CPA·tan(θ)       COMEX = t_CPA·v     FINEX = (t_fin − t_CPA)·v</div>

  </section>`;
  el.querySelectorAll('[data-s]').forEach(i=>i.addEventListener('change',()=>{const k=i.dataset.s;

}

function b64f(a){const u=new Uint8Array(a.buffer,a.byteOffset,a.byteLength);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function f32b(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Float32Array(u.buffer)}
const replacer=(k,v)=>(v instanceof Float32Array||v instanceof Float64Array)?{__f32:b64f(v instanceof Float32Array?v:Float32Array.from(v))}:v;
const reviver=(k,v)=>v&&typeof v==='object'&&typeof v.__f32==='string'?f32b(v.__f32):v;
function packRes(R){if(!R)return null;const o={...R};
  const cut=(arr,df)=>arr?arr.map(a=>a.slice(0,Math.min(a.length,Math.ceil(Math.min(R.fs/2,Math.max(S.fmax*1.5,2000))/df)+2))):arr;
  o.psd=cut(R.psd,R.df);o.psdBg=cut(R.psdBg,R.dfBg||R.df);if(R.sync){o.sync={...R.sync};delete o.sync.tr;}return o}
function projectData(){
  return{app:'procesador-urn',v:1,appVersion:APP_VERSION,savedAt:new Date().toISOString(),settings:S,template,curId,
    pool:pool.map(g=>({id:g.id,name:g.name,role:g.role,pairHyd:g.pairHyd||null,fixes:g.fixes.map(f=>[f.t,f.lat,f.lon,fin(f.sog)?f.sog:null,fin(f.cog)?f.cog:null])})),
    bgPool:bgPool.map(b=>({id:b.id,name:b.name,meta:b.meta})),
    passes:passes.map(p=>{const o={};for(const k of PFIELDS)o[k]=p[k];o.res=packRes(p.res);return o})};
}

  freeAll();
  S=Object.assign({},DEF,o.settings||{});if(S.lim!=='none'&&!LIMITS[S.lim])S.lim='R';S.showLim=S.lim!=='none';saveS();
  if(o.template){template=o.template;LS.set('urn.template',template);}
  pool=(o.pool||[]).map(g=>{const fixes=g.fixes.map(a=>({t:a[0],lat:a[1],lon:a[2],sog:a[3]??undefined,cog:a[4]??undefined}));const sog=fixes.filter(f=>fin(f.sog)).map(f=>f.sog).sort((a,b)=>a-b);
    return{id:g.id,name:g.name,role:g.role,pairHyd:g.pairHyd,fixes,t0:fixes.length?fixes[0].t:0,t1:fixes.length?fixes[fixes.length-1].t:0,sog:sog.length?sog[Math.floor(sog.length/2)]:null,...guessFromName(g.name)}});
  bgPool=(o.bgPool||[]).map(b=>({id:b.id,name:b.name,meta:b.meta||null,file:null}));
  passes=o.passes.map(q=>{const p=newPass({});for(const k of PFIELDS)if(q[k]!==undefined)p[k]=q[k];p.id=q.id;p.file=null;p.res=q.res||null;p.busy=false;p.err=null;
    const src=p.dcpaSrc;refreshGPS(p);if(src==='manual')p.dcpaSrc='manual';return p});
  passes.forEach(p=>{if(p.res&&p.resKey==null)p.resKey=procKey(p)});
  uid=Math.max(uid,1+Math.max(0,...pool.map(g=>g.id),...bgPool.map(b=>b.id),...passes.map(p=>p.id)));
  curId=passes.some(p=>p.id===o.curId)?o.curId:(passes[0]?.id??null);sumSel=null;
  renderList();renderDetail();if(!$('#view-r').hidden)renderSummary();if(!$('#view-a').hidden)renderSettings();
}
/* ficheros: selector de carpeta (Chrome/Edge) o descarga */
const canPick=()=>typeof window.showSaveFilePicker==='function';
async function writeHandle(h,data){
  if(h.queryPermission&&(await h.queryPermission({mode:'readwrite'}))!=='granted'){if((await h.requestPermission({mode:'readwrite'}))!=='granted')throw new Error('denied')}
  const w=await h.createWritable();await w.write(data);await w.close();}
let dlNs;
async function saveFile(name,data){
  try{if(window.claude?.use){if(dlNs===undefined)dlNs=await window.claude.use('downloads').catch(()=>null);if(dlNs){await dlNs.save({filename:name,data:new Blob([data])});toast('Guardado: '+name);return true}}}catch(e){if(e&&e.code==='declined')return false;if(e&&e.code==='rate_limited'){toast('Espera un momento y vuelve a intentarlo');return false}}
  try{const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Descargado: '+name);return true}
  catch(e){toast('Este visor no permite guardar ficheros: usa la versión de GitHub o la aplicación instalada');return false}
}
const p2=n=>String(n).padStart(2,'0');
function stamp(){const d=new Date();return `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}`}
async function saveProject(as){
  if(!passes.length){toast('No hay nada que guardar todavía');return}
  let data;try{data=projectJSON()}catch(e){toast('No se pudo preparar el proyecto: '+e.message,5000);return}
  const sig=projSig();
  if(!as&&proj.handle){try{await writeHandle(proj.handle,data);proj.savedSig=sig;updateProj();toast('Guardado: '+proj.name);return}catch(e){}}
  const name=proj.name||`proyecto-urn-${stamp()}.json`;
  if(canPick()){try{const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Proyecto URN',accept:{'application/json':['.json']}}]});
      await writeHandle(h,data);proj.handle=h;proj.name=h.name;proj.savedSig=sig;updateProj();toast('Guardado: '+h.name);return}
    catch(e){if(e&&e.name==='AbortError')return}}
  if(await saveFile(name,data)){proj.name=name;proj.handle=null;proj.savedSig=sig;updateProj();}
}
function askConfirm(msg,ok){return new Promise(res=>{const b=$('#ovlbox');b.innerHTML=`<div class="ctool"><span class="t">${esc(msg)}</span></div><div class="ctool" style="justify-content:flex-end"><button class="btn sm" id="cf-no">Cancelar</button><button class="btn sm pri" id="cf-ok">${esc(ok)}</button></div>`;
  $('#ovl').hidden=false;const done=v=>{$('#ovl').hidden=true;res(v)};$('#cf-no').onclick=()=>done(false);$('#cf-ok').onclick=()=>done(true);$('#cf-ok').focus();})}
async function openProjectFile(file,handle){
  if(isDirty()&&!(await askConfirm('Hay cambios sin guardar en el proyecto actual. ¿Abrir otro igualmente?','Abrir sin guardar')))return;
  try{const o=JSON.parse(await file.text(),reviver);loadProjectData(o);proj.handle=handle||null;proj.name=file.name;proj.savedSig=projSig();updateProj();
    const miss=passes.filter(p=>p.fileName&&!p.synth).length;toast(`Proyecto «${file.name}» abierto · ${passes.length} pasada${passes.length===1?'':'s'}${miss?'. Para reprocesar, vuelve a cargar las señales':''}`,5000);}
  catch(e){toast(e.message==='formato'?'Ese fichero no es un proyecto del Procesador URN (.json)':'No se pudo abrir el proyecto: '+e.message,5000)}
}
async function openDialog(){
  if(typeof window.showOpenFilePicker==='function'){try{const [h]=await window.showOpenFilePicker({types:[{description:'Proyecto URN',accept:{'application/json':['.json']}}]});await openProjectFile(await h.getFile(),h);return}catch(e){if(e&&e.name==='AbortError')return}}
  $('#f-proj').value='';$('#f-proj').click();
}
async function newProject(){
  if(isDirty()&&!(await askConfirm('Hay cambios sin guardar. ¿Empezar un proyecto nuevo y descartarlos?','Descartar y empezar')))return;
  await freeAll();passes=[];pool=[];bgPool=[];curId=null;sumSel=null;proj.handle=null;proj.name=null;proj.savedSig=null;
  renderList();renderDetail();if(!$('#view-r').hidden)renderSummary();toast('Proyecto nuevo');
}
$('#b-new').onclick=()=>newProject();$('#b-open').onclick=()=>openDialog();$('#b-save').onclick=()=>saveProject(false);$('#b-saveas').onclick=()=>saveProject(true);
$('#f-proj').onchange=e=>{const f=e.target.files[0];if(f)openProjectFile(f,null)};
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
  if(k==='s'){e.preventDefault();saveProject(e.shiftKey)}else if(k==='o'){e.preventDefault();openDialog()}});
window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});
/* sesión automática en IndexedDB (solo este navegador) */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('procesador-urn',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbPut(){try{if(!passes.length)return;const data=projectJSON();const db=await idb();db.transaction('s','readwrite').objectStore('s').put({data,t:Date.now(),n:passes.length,name:proj.name},'last')}catch(e){}}
async function idbGet(){try{const db=await idb();return await new Promise(res=>{const r=db.transaction('s').objectStore('s').get('last');r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}}
renderList();renderDetail();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>ALLCH.forEach(c=>c.draw()));
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('Hay una versión nueva de la herramienta: guarda el proyecto y recarga la página (F5)',8000)});}</script>
